<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>moda sign-in</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#010207;color:#f2f2f2;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:0 16px;box-sizing:border-box;
  background:radial-gradient(ellipse at 80% 10%,#1b1440 0,#010207 60%)}
.card{width:min(100%,440px);box-sizing:border-box;padding:28px;border-radius:20px;background:rgba(28,28,30,.97);border:1px solid rgba(255,255,255,.12)}
h1{font-size:22px;margin:0 0 8px;font-weight:600}
p{color:#b9bcc6;font-size:14px;margin:0 0 16px}
.err{color:#ffb4a9}
a.btn{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:12px;background:#3ee0f0;color:#00161a;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <h1 id="t">Family Frames</h1>
  <p id="m">This page hands Google's sign-in back to your TV. Scan the QR code on the TV to start.</p>
  <div id="x"></div>
</main>
<script>
// Google sends the phone here after sign-in. The code is useless on its own (the TV holds the PKCE verifier),
// so we only pass it straight on to the TV on this Wi-Fi. "state" says where the TV is: "<private IPv4>:<port>~<token>".
(function () {
  var q = new URLSearchParams(location.search);
  var t = document.getElementById('t'), m = document.getElementById('m'), x = document.getElementById('x');
  var st = q.get('state') || '';
  var s = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}):(\d{2,5})~([a-z0-9]{10,40})$/.exec(st);
  if (!s) return;
  var tv = 'http://' + s[1] + ':' + s[2] + '/' + s[3] + '/cb';
  var err = q.get('error'), code = q.get('code');
  if (err) {
    t.textContent = 'Sign-in cancelled';
    m.className = 'err';
    m.textContent = err === 'access_denied'
      ? 'Google access wasn’t allowed, so Family Frames can’t show your photos. Try again from the TV.'
      : 'Google said: ' + err + '. Try again from the TV.';
    return;
  }
  if (!code) return;
  var go = tv + '?code=' + encodeURIComponent(code);
  history.replaceState(null, '', location.pathname);   // keep the code out of history
  t.textContent = 'Signed in ✓';
  m.textContent = 'Handing over to your TV… Keep this phone on the same Wi-Fi as the TV.';
  var a = document.createElement('a');
  a.className = 'btn'; a.href = go; a.rel = 'noreferrer'; a.textContent = 'Continue on TV';
  x.appendChild(a);
  location.replace(go);
})();
</script>
</body>
</html>
